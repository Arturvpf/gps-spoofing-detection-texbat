[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "texbat-spoofing"
version = "1.0.0"
description = "GPS L1 C/A spoofing detection on TEXBAT via correlation-based Signal Quality Monitoring (SQM) and machine learning"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Artur Vinicius Pereira Fernandes" },
    { name = "Isabela Maria de Moura Nascimento" },
    { name = "Karina Lima de Oliveira" },
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scikit-learn>=1.3",
    "h5py>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "nbformat>=5.9",
    "nbclient>=0.9",
    "ipykernel>=6.25",
    "jupyter>=1.0",
]

[project.scripts]
texbat-spoofing = "texbat_spoofing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
